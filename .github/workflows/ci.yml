name: CI

# Minimal CI for the marketing-agency repo.
#
#   - Lint:  ruff check .
#   - Test:  pytest (the full suite; runs in a few seconds)
#
# Tests must NOT call real external APIs. The job exports stub values for
# every required env var so any code path that reads os.environ at import
# time keeps working; tests that hit Kling / Meta / Anthropic / Tavily /
# Apify already mock at the boundary (see tests/test_*.py for the pattern).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ruff + pytest (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          # Cache key changes whenever the lockfile changes, so contributors
          # can refresh dependencies without manually busting the cache.
          cache-dependency-path: "requirements-lock.txt"

      - name: Install pinned dependencies (from lockfile)
        # Lockfile generated under Python 3.11 via:
        #   py -3.11 -m piptools compile pyproject.toml --extra dev \
        #       -o requirements-lock.txt
        # Installing from the lock guarantees CI sees the exact versions
        # the maintainer last verified, and prunes stray packages (e.g.
        # the leftover langgraph-prebuilt 1.x that conflicted with our
        # langchain-core 0.3 pin) that pyproject's range would otherwise
        # quietly accept.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Install local project (no dependency re-resolution)
        # --no-deps prevents pip from re-evaluating any pyproject ranges
        # and silently upgrading something the lockfile pinned. The
        # editable install is purely for our source tree (core, agents,
        # services, ui).
        run: python -m pip install -e . --no-deps

      - name: Verify dependency tree is consistent
        # Cheap belt-and-suspenders: fails the build if anyone slips a
        # conflicting version into the lockfile.
        run: python -m pip check

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Tests (pytest)
        # Stub env vars so import-time os.environ reads do not fail. These
        # are NOT real credentials; every external API call in the test
        # suite is mocked at the requests / SDK boundary.
        env:
          ANTHROPIC_API_KEY: stub-anthropic
          TAVILY_API_KEY: stub-tavily
          APIFY_API_TOKEN: stub-apify
          KLING_API_KEY: stub-kling-key
          KLING_API_SECRET: stub-kling-secret
          META_ACCESS_TOKEN: stub-meta-token
          META_AD_ACCOUNT_ID: act_stub
        run: python -m pytest
